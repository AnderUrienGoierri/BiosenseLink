# Remote Services Page for Homer
# Inherits settings from config.yml, only overrides links and services

links:
  - name: "Servicios Locales"
    icon: "fas fa-laptop-medical"
    url: "#"
  - name: "Servicios Remotos"
    icon: "fas fa-network-wired"
    url: "#remote"
  - name: "Hub de APIs"
    icon: "fas fa-code"
    url: "#apis"
  - name: "Bases de Datos Científicas"
    icon: "fas fa-book-medical"
    url: "#scientific"
  - name: "Monitoreo en Tiempo Real"
    icon: "fas fa-chart-line"
    url: "#monitoring"
  - name: "Portal GOsasun"
    icon: "fas fa-heartbeat"
    url: "#gosasun"

services:
  - name: "Servicios en Máquinas Virtuales (VMs / Servidores)"
    icon: "fas fa-server"
    items:
      - name: "Cockpit Arch Linux"
        logo: "assets/logos/linux.svg"
        subtitle: "Administración web de VM Arch Linux (Puerto 9091 en Localhost)"
        tag: "Arch VM"
        url: "https://localhost:9091"
        target: "_blank"
      - name: "Cockpit Fedora Workstation"
        logo: "assets/logos/cockpit.svg"
        subtitle: "Administración web de VM Fedora (Puerto 9090 en Localhost)"
        tag: "Fedora VM"
        url: "https://localhost:9090"
        target: "_blank"
      - name: "Ubuntu Web App Test"
        logo: "assets/logos/linux.svg"
        subtitle: "Servidor web Nginx en VM Ubuntu (Puerto 8083 en Localhost)"
        tag: "Ubuntu VM"
        url: "http://localhost:8083"
        target: "_blank"

  - name: "Entorno CachyOS (Partición de este Portátil)"
    icon: "fas fa-laptop"
    items:
      - name: "CachyOS Cockpit Panel"
        logo: "assets/logos/linux.svg"
        subtitle: "Acceso Web al panel Cockpit de CachyOS (cuando esté activo)"
        tag: "CachyOS"
        url: "https://192.168.1.100:9090"
        target: "_blank"
      - name: "CachyOS Local Web Dev"
        logo: "assets/logos/apache.svg"
        subtitle: "Servidor Web local de pruebas en CachyOS (Puerto 8000)"
        tag: "Web Dev"
        url: "http://192.168.1.100:8000"
        target: "_blank"
      - name: "CachyOS SSH Portal"
        logo: "assets/logos/linux.svg"
        subtitle: "Acceso terminal SSH a la partición CachyOS (puerto 22)"
        tag: "SSH"
        url: "ssh://ander@192.168.1.100"
        target: "_blank"
