# Developer APIs Page for Homer
# Inherits settings from config.yml, only overrides links and services

links:
  - name: "Servicios Locales"
    icon: "fas fa-laptop-medical"
    url: "#"
  - name: "Servicios Remotos"
    icon: "fas fa-network-wired"
    url: "#remote"
  - name: "Hub de APIs"
    icon: "fas fa-code"
    url: "#apis"
  - name: "Bases de Datos Científicas"
    icon: "fas fa-book-medical"
    url: "#scientific"
  - name: "Monitoreo en Tiempo Real"
    icon: "fas fa-chart-line"
    url: "#monitoring"
  - name: "Portal GOsasun"
    icon: "fas fa-heartbeat"
    url: "#gosasun"

services:
  - name: "APIs de Desarrollo y Consolas de Control"
    icon: "fas fa-terminal"
    items:
      - name: "FastAPI Swagger UI"
        logo: "assets/logos/biosenselink.png"
        subtitle: "Documentación interactiva de la API de control clínico (Swagger)"
        tag: "API Docs"
        url: "http://localhost:8081/docs"
        target: "_blank"
      - name: "FastAPI ReDoc"
        logo: "assets/logos/biosenselink.png"
        subtitle: "Documentación estructurada de referencia de la API (ReDoc)"
        tag: "API Docs"
        url: "http://localhost:8081/redoc"
        target: "_blank"
      - name: "HAPI FHIR Explorer"
        logo: "assets/logos/hapi-fhir.png"
        subtitle: "Navegador y explorador de recursos FHIR clínicos"
        tag: "FHIR API"
        url: "http://localhost:8080"
        target: "_blank"
      - name: "Ollama API Endpoint"
        logo: "assets/logos/ollama.svg"
        subtitle: "Comprobación de estado y catálogo de modelos LLM activos"
        tag: "Local AI"
        url: "http://localhost:11434"
        target: "_blank"
      - name: "n8n Webhook Triggers"
        logo: "assets/logos/n8n.svg"
        subtitle: "Endpoints de Webhooks para automatizaciones y flujos"
        tag: "Workflow"
        url: "http://localhost:5678"
        target: "_blank"
