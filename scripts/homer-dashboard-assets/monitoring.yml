# System Monitoring Page for Homer
# Inherits settings from config.yml, only overrides links and services

links:
  - name: "Servicios Locales"
    icon: "fas fa-laptop-medical"
    url: "#"
  - name: "Servicios Remotos"
    icon: "fas fa-network-wired"
    url: "#remote"
  - name: "Hub de APIs"
    icon: "fas fa-code"
    url: "#apis"
  - name: "Bases de Datos Científicas"
    icon: "fas fa-book-medical"
    url: "#scientific"
  - name: "Monitoreo en Tiempo Real"
    icon: "fas fa-chart-line"
    url: "#monitoring"
  - name: "Portal GOsasun"
    icon: "fas fa-heartbeat"
    url: "#gosasun"

services:
  - name: "Monitoreo de Infraestructura y Logs"
    icon: "fas fa-chart-line"
    items:
      - name: "🟢 Estado de Servicios"
        logo: "assets/logos/linux.svg"
        subtitle: "Monitor TCP en tiempo real de todos los servicios"
        tag: "Status"
        url: "http://localhost:8000/status.php"
        target: "_blank"
      - name: "Dozzle Log Viewer"
        logo: "assets/logos/portainer.svg"
        subtitle: "Visor de logs en tiempo real para todos los contenedores Docker"
        tag: "Live Logs"
        url: "http://localhost:8888"
        target: "_blank"
      - name: "Glances Hardware Monitor"
        logo: "assets/logos/cockpit.svg"
        subtitle: "Panel en tiempo real de consumo de hardware, CPU, RAM y red"
        tag: "Sys Stats"
        url: "http://localhost:61208"
        target: "_blank"
