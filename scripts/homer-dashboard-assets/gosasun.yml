# GOsasun Services Page for Homer
# Inherits settings from config.yml, only overrides links and services

links:
  - name: "Servicios Locales"
    icon: "fas fa-laptop-medical"
    url: "#"
  - name: "Servicios Remotos"
    icon: "fas fa-network-wired"
    url: "#remote"
  - name: "Hub de APIs"
    icon: "fas fa-code"
    url: "#apis"
  - name: "Bases de Datos Científicas"
    icon: "fas fa-book-medical"
    url: "#scientific"
  - name: "Monitoreo en Tiempo Real"
    icon: "fas fa-chart-line"
    url: "#monitoring"
  - name: "Portal GOsasun"
    icon: "fas fa-heartbeat"
    url: "#gosasun"

services:
  - name: "Lanzadores y Base de Datos (Desktop & SQL)"
    icon: "fas fa-database"
    items:
      - name: "Lanzar GOsasun App (Desktop)"
        logo: "assets/logos/mysql.svg"
        subtitle: "Ejecuta la aplicación de escritorio GOsasun (C#) en segundo plano"
        tag: "Desktop App"
        url: "http://localhost:8081/api/gosasun/launch"
        target: "_self"
      - name: "Lanzar MySQL Workbench"
        logo: "assets/logos/mysql.svg"
        subtitle: "Ejecuta MySQL Workbench local en segundo plano"
        tag: "MySQL Client"
        url: "http://localhost:8081/api/mysql-workbench/launch"
        target: "_self"
      - name: "phpMyAdmin (Base de datos GOsasun)"
        logo: "assets/logos/phpmyadmin.svg"
        subtitle: "Gestión web de la base de datos gosasun_db (Puerto 8082)"
        tag: "MySQL Web"
        url: "http://localhost:8082/index.php?db=gosasun_db"
        target: "_blank"

  - name: "Portales de Gestión Web (PHP / Apache)"
    icon: "fas fa-hospital-user"
    items:
      - name: "GOsasun Atari Nagusia"
        logo: "assets/logos/apache.svg"
        subtitle: "Acceso general y login al portal de salud"
        tag: "Hasiera (80)"
        url: "http://localhost/05_Projects/Goierri_MAD/MARKATZE_LENGOAIAK/Web_Projects/GOsasun_web/index.php"
        target: "_blank"
      - name: "Atari Pazientea (Pacientes)"
        icon: "fas fa-user-injured"
        subtitle: "Portal web para que los pacientes ingresen medidas y consulten citas"
        tag: "Pazientea"
        url: "http://localhost/05_Projects/Goierri_MAD/MARKATZE_LENGOAIAK/Web_Projects/GOsasun_web/php_pazienteak/index.php"
        target: "_blank"
      - name: "Atari Medikuak (Médicos)"
        icon: "fas fa-user-md"
        subtitle: "Portal web para el personal médico (recetas, seguimiento, etc.)"
        tag: "Medikua"
        url: "http://localhost/05_Projects/Goierri_MAD/MARKATZE_LENGOAIAK/Web_Projects/GOsasun_web/php_osasun_langileak/index.php"
        target: "_blank"
      - name: "Atari Harrera (Recepción)"
        icon: "fas fa-concierge-bell"
        subtitle: "Portal web para el personal de recepción (gestión de citas y pacientes)"
        tag: "Harrera"
        url: "http://localhost/05_Projects/Goierri_MAD/MARKATZE_LENGOAIAK/Web_Projects/GOsasun_web/php_harrera_langileak/index.php"
        target: "_blank"
